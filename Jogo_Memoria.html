<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Jogo da Memória</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 70px);
            gap: 10px;
            margin-bottom: 20px;
        }

        .card {
            width: 70px;
            height: 70px;
            background-color: #007bff;
            color: white;
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
        }

        .timer {
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="grid" id="grid"></div>
    <div class="timer" id="timer" onclick="reiniciarSeVenceu()">0.0s</div>

    <script>
        const emojisBase = ["🐶", "🐱", "🐭", "🐻", "🐼", "🐨", "🐸", "🐮", "🦁", "🐟"];
        let cards = [];
        let firstCard = null;
        let lockBoard = false;
        let matchesFound = 0;
        let tenthsElapsed = 0;
        let timerInterval = null;

        function setupGame() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            
            // Duplica os emojis para formar os pares e embaralha
            let deck = [...emojisBase, ...emojisBase].sort(() => Math.random() - 0.5);
            
            matchesFound = 0;
            firstCard = null;
            lockBoard = false;
            
            deck.forEach((emoji) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.emoji = emoji;
                card.textContent = '❓';
                card.addEventListener('click', flipCard);
                grid.appendChild(card);
            });

            // Reinicia o cronômetro
            clearInterval(timerInterval);
            tenthsElapsed = 0;
            document.getElementById('timer').textContent = "0.0s";
            timerInterval = setInterval(() => {
                tenthsElapsed++;
                document.getElementById('timer').textContent = (tenthsElapsed / 10).toFixed(1) + "s";
            }, 100);
        }

        function flipCard() {
            if (lockBoard || this === firstCard || this.textContent !== '❓') return;

            // Revela o emoji escondido no data attribute
            this.textContent = this.dataset.emoji;

            if (!firstCard) {
                firstCard = this;
                return;
            }

            // Segundo clique
            if (firstCard.dataset.emoji === this.dataset.emoji) {
                // Par correto
                matchesFound++;
                firstCard = null;

                if (matchesFound === 10) {
                    clearInterval(timerInterval);
                    document.getElementById('timer').textContent += " - Jogar novamente?";
                }
            } else {
                // Errou: esconde as duas cartas após um breve intervalo
                lockBoard = true;
                setTimeout(() => {
                    firstCard.textContent = '❓';
                    this.textContent = '❓';
                    firstCard = null;
                    lockBoard = false;
                }, 800);
            }
        }

        function reiniciarSeVenceu() {
            if (matchesFound === 10) {
                setupGame();
            }
        }

        setupGame();
    </script>
</body>
</html>
